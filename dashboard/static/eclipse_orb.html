<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS — Eclipse Core</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000204;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
  }
  canvas { display: block; cursor: pointer; }
  #status {
    position: absolute;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 4px;
    color: #00e5ff;
    text-shadow: 0 0 12px currentColor, 0 0 24px currentColor;
    pointer-events: none;
    transition: color 0.4s ease, text-shadow 0.4s ease;
    white-space: nowrap;
  }
  #name {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 11px;
    letter-spacing: 8px;
    color: #1a4060;
    pointer-events: none;
  }
  #hint {
    position: absolute;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 9px;
    letter-spacing: 2px;
    color: #0d2535;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="name">J · A · R · V · I · S</div>
<div id="status">●  LISTENING</div>
<div id="hint">CLICK TO CYCLE STATES</div>

<script>
const canvas = document.getElementById('c');
const statusEl = document.getElementById('status');
const gl = canvas.getContext('webgl2') || canvas.getContext('webgl');

const VS = `
attribute vec2 aPos;
varying vec2 vUV;
void main(){
  gl_Position = vec4(aPos, 0.0, 1.0);
  vUV = aPos;
}`;

const FS = `
precision highp float;
varying vec2 vUV;
uniform float uTime;
uniform float uAmp;
uniform vec3  uCoronaCol;
uniform vec3  uCoreCol;
uniform float uEnergy;
uniform float uWakePulse;

float hash(vec2 p){ return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453); }

float noise(vec2 p){
  vec2 i=floor(p), f=fract(p);
  f=f*f*(3.0-2.0*f);
  return mix(mix(hash(i),hash(i+vec2(1,0)),f.x),
             mix(hash(i+vec2(0,1)),hash(i+vec2(1,1)),f.x),f.y);
}

float fbm(vec2 p){
  float v=0.,a=0.5;
  for(int i=0;i<6;i++){v+=a*noise(p);p=p*2.1+vec2(1.7,9.2);a*=0.5;}
  return v;
}

float turbulence(vec2 uv, float t, float e){
  vec2 q=vec2(fbm(uv+t*0.18),fbm(uv+vec2(5.2,1.3)+t*0.22));
  vec2 r=vec2(fbm(uv+4.0*q+vec2(1.7,9.2)+t*0.14),fbm(uv+4.0*q+vec2(8.3,2.8)+t*0.11));
  return fbm(uv+4.5*r+t*e*0.08);
}

void main(){
  vec2 uv=vUV;
  float r=length(uv);
  float ang=atan(uv.y,uv.x);
  float t=uTime;
  float energy=uEnergy+uAmp*0.35;
  float coreR=0.28;

  vec2 polarUV=vec2(ang/6.2832+0.5, r*2.2);
  float turb=turbulence(polarUV*2.8, t, energy+0.4);

  float streamerR=coreR+0.02+turb*(0.55+uAmp*0.25)*uEnergy;
  float band=abs(r-streamerR);
  float corona=0.0;
  corona+=0.22*exp(-band*14.0/max(uEnergy,0.1));
  corona+=0.12*exp(-band*7.0 /max(uEnergy,0.1));
  corona+=0.06*exp(-band*3.5 /max(uEnergy,0.1));

  float coronaR=coreR+0.52*uEnergy;
  float tendril=max(0.0,1.0-(r-coreR)/(coronaR*1.2));
  tendril=pow(tendril,2.8)*turb*uEnergy;
  corona+=tendril*0.35;

  float mask=smoothstep(coreR-0.01, coreR+0.03, r);
  float innerG=1.0-smoothstep(0.0,coreR,r);
  float coreGlow=innerG*innerG*0.22*uEnergy;

  float shockR=mix(coreR*0.9, 0.85, 1.0-uWakePulse);
  float shockW=exp(-pow((r-shockR)*28.0,2.0))*uWakePulse;

  float nebula=fbm(uv*1.4+t*0.04)*max(0.0,1.0-r*1.6)*0.12;

  vec3 col=vec3(0.0);
  col+=uCoronaCol*corona;
  col+=uCoreCol*coreGlow;
  col+=vec3(0.5,0.85,1.0)*shockW*0.9;
  col+=uCoronaCol*0.6*nebula;
  col*=mask;
  col+=uCoreCol*(1.0-mask)*coreGlow*0.6;

  float vig=1.0-smoothstep(0.55,1.10,r);
  col*=vig;
  col=col/(col+0.55);
  col=pow(col,vec3(0.95));

  gl_FragColor=vec4(col,1.0);
}`;

function compile(type,src){
  const s=gl.createShader(type);
  gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))console.error(gl.getShaderInfoLog(s));
  return s;
}
const prog=gl.createProgram();
gl.attachShader(prog,compile(gl.VERTEX_SHADER,VS));
gl.attachShader(prog,compile(gl.FRAGMENT_SHADER,FS));
gl.linkProgram(prog);
gl.useProgram(prog);

const buf=gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER,buf);
gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
const loc=gl.getAttribLocation(prog,'aPos');
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);

const U={};
['uTime','uAmp','uCoronaCol','uCoreCol','uEnergy','uWakePulse'].forEach(n=>U[n]=gl.getUniformLocation(prog,n));

const STATES={
  SLEEPING:  {corona:[0.45,0.08,0.28],core:[0.25,0.04,0.18],energy:0.18,label:'💤  STANDBY',   col:'#7a2848'},
  WAKING:    {corona:[0.00,0.75,0.95],core:[0.20,0.60,0.90],energy:0.72,label:'⚡  WAKING UP', col:'#00e5ff'},
  LISTENING: {corona:[0.00,0.78,0.95],core:[0.00,0.50,0.80],energy:0.52,label:'●  LISTENING',  col:'#00e5ff'},
  THINKING:  {corona:[1.00,0.72,0.00],core:[1.00,0.45,0.00],energy:0.68,label:'◈  THINKING',   col:'#ffb700'},
  PROCESSING:{corona:[1.00,0.72,0.00],core:[1.00,0.45,0.00],energy:0.68,label:'▷  PROCESSING', col:'#ffb700'},
  SPEAKING:  {corona:[1.00,0.42,0.00],core:[1.00,0.22,0.00],energy:0.82,label:'●  SPEAKING',   col:'#ff6600'},
  EXECUTING: {corona:[0.00,0.55,1.00],core:[0.10,0.85,1.00],energy:0.92,label:'⚡  EXECUTING', col:'#00c8ff'},
  SUCCESS:   {corona:[0.00,0.95,0.50],core:[0.00,0.70,0.35],energy:0.72,label:'✔  COMPLETE',   col:'#00ff99'},
  ERROR:     {corona:[1.00,0.10,0.15],core:[0.80,0.05,0.10],energy:0.76,label:'⚠  ALERT',      col:'#ff1144'},
  MUTED:     {corona:[1.00,0.12,0.40],core:[0.70,0.05,0.20],energy:0.28,label:'⊘  MUTED',      col:'#ff2266'},
};

let curState='LISTENING';
let tgt={...STATES.LISTENING};
let dispCorona=[0,0.78,0.95], dispCore=[0,0.5,0.8], dispEnergy=0.52;
let liveAmp=0, dispAmp=0, wakePulse=0;
let blinkTick=0;

function setState(name){
  const s=STATES[name.toUpperCase()]||STATES.LISTENING;
  const old=curState;
  curState=name.toUpperCase();
  tgt=s;
  if(old==='SLEEPING'||name==='WAKING') wakePulse=1.0;
  statusEl.textContent=s.label;
  statusEl.style.color=s.col;
  statusEl.style.textShadow='0 0 12px '+s.col+', 0 0 28px '+s.col+'44';
}

function resize(){
  const sz=Math.min(window.innerWidth,window.innerHeight);
  canvas.width=canvas.height=sz;
  gl.viewport(0,0,sz,sz);
}
window.addEventListener('resize',resize); resize();

const t0=performance.now();
function lerp(a,b,t){return a+(b-a)*t;}

function frame(now){
  const t=(now-t0)*0.001;
  const sp=0.04;
  for(let i=0;i<3;i++) dispCorona[i]=lerp(dispCorona[i],tgt.corona[i],sp);
  for(let i=0;i<3;i++) dispCore[i]=lerp(dispCore[i],tgt.core[i],sp);
  dispEnergy=lerp(dispEnergy,tgt.energy+liveAmp*0.22,0.05);
  liveAmp*=0.88;
  dispAmp=lerp(dispAmp,liveAmp,0.4);
  if(wakePulse>0.001){wakePulse*=0.96;if(wakePulse<0.001)wakePulse=0;}

  blinkTick++;
  if(blinkTick%40===0){
    const s=STATES[curState];
    if(s){
      const blink=(blinkTick%80)<40;
      let lbl=s.label;
      if(curState==='LISTENING') lbl=blink?'●  LISTENING':'○  LISTENING';
      if(curState==='THINKING')  lbl=blink?'◈  THINKING':'◇  THINKING';
      if(curState==='EXECUTING') lbl=blink?'⚡  EXECUTING':'◆  EXECUTING';
      if(curState==='SLEEPING')  lbl=blink?'💤  STANDBY':'⊘  STANDBY';
      statusEl.textContent=lbl;
    }
  }

  gl.clearColor(0,0.008,0.016,1);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform1f(U.uTime,t);
  gl.uniform1f(U.uAmp,dispAmp);
  gl.uniform3fv(U.uCoronaCol,dispCorona);
  gl.uniform3fv(U.uCoreCol,dispCore);
  gl.uniform1f(U.uEnergy,dispEnergy);
  gl.uniform1f(U.uWakePulse,wakePulse);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// WebSocket (talks to JARVIS)
let ws;
function connectWS(){
  try{
    ws=new WebSocket('ws://localhost:7474');
    ws.onmessage=e=>{
      try{const m=JSON.parse(e.data);if(m.state)setState(m.state);if(typeof m.amp==='number')liveAmp=Math.min(1,Math.max(0,m.amp));}catch(_){}
    };
    ws.onclose=()=>setTimeout(connectWS,3000);
    ws.onerror=()=>ws.close();
  }catch(_){}
}
connectWS();

// Demo cycling
const demoList=['LISTENING','THINKING','SPEAKING','EXECUTING','SUCCESS','LISTENING','SLEEPING','WAKING','LISTENING'];
let di=0;
function nextDemo(){
  setState(demoList[di%demoList.length]); di++;
  if(curState==='SPEAKING'||curState==='EXECUTING'){
    const iv=setInterval(()=>{liveAmp=Math.random()*0.85;},80);
    setTimeout(()=>clearInterval(iv),3500);
  }
  setTimeout(nextDemo,4000+Math.random()*2000);
}
setTimeout(nextDemo,1200);

// Click to cycle
const stateKeys=Object.keys(STATES); let ci=0;
canvas.addEventListener('click',()=>{setState(stateKeys[ci%stateKeys.length]);ci++;});
</script>
</body>
</html>
