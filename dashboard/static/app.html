<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS // QUANTUM DASHBOARD</title>
  <script src="/static/crypto.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --void:        #000408;
      --deep:        #010812;
      --surface:     rgba(1, 14, 26, 0.72);
      --surface-b:   rgba(0, 229, 255, 0.08);
      --border:      rgba(0, 229, 255, 0.16);
      --border-glow: rgba(0, 229, 255, 0.45);
      --plasma:      #00e5ff;
      --plasma-dim:  #0088aa;
      --gold:        #ffb700;
      --gold-dim:    rgba(255, 183, 0, 0.15);
      --text:        #c8eeff;
      --muted:       #4a9ab8;
      --green:       #00ff99;
      --gdim:        rgba(0, 255, 153, 0.12);
      --red:         #ff1144;
      --rdim:        rgba(255, 17, 68, 0.15);
    }
    html, body {
      height: 100%;
      background: var(--void);
      color: var(--text);
      font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
    }

    /* ── Background Canvas ── */
    #bg-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
    }
    .scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(0, 229, 255, 0) 50%, rgba(0, 229, 255, 0.015) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 1;
    }

    /* ── HEADER ── */
    header {
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 18px;
      border-bottom: 1px solid var(--border);
      background: rgba(1, 8, 18, 0.88);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .logo {
      font-family: 'Orbitron', monospace;
      font-size: 17px;
      font-weight: 900;
      letter-spacing: 6px;
      color: #fff;
      text-shadow: 0 0 14px rgba(0, 229, 255, 0.6);
    }
    .logo em {
      color: var(--plasma);
      font-style: normal;
    }
    .pill {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 99px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      transition: all 0.3s;
    }
    .pill.on {
      background: var(--gdim);
      border-color: rgba(0, 255, 153, 0.4);
      color: var(--green);
      box-shadow: 0 0 10px rgba(0, 255, 153, 0.2);
    }
    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }
    .pill.on .dot {
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: blink 2s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.35} }
    .spacer { flex: 1; }
    .enc-badge {
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1.5px;
      padding: 3px 9px;
      border-radius: 4px;
      display: none;
    }
    .enc-badge.on {
      display: block;
      background: var(--gdim);
      border: 1px solid rgba(0, 255, 153, 0.3);
      color: var(--green);
    }
    .enc-badge.off {
      display: block;
      background: var(--rdim);
      border: 1px solid rgba(255, 17, 68, 0.3);
      color: #ff6688;
    }
    .url {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      padding: 4px 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
    }

    /* ── FEED ── */
    main {
      position: relative;
      z-index: 2;
      flex: 1;
      overflow-y: auto;
      padding: 16px 18px 10px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    main::-webkit-scrollbar { width: 4px; }
    main::-webkit-scrollbar-thumb {
      background: rgba(0, 229, 255, 0.25);
      border-radius: 4px;
    }
    main::-webkit-scrollbar-thumb:hover {
      background: var(--plasma);
    }

    .msg {
      max-width: 82%;
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.55;
      animation: pop 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }
    @keyframes pop {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-j {
      align-self: flex-start;
      background: rgba(0, 229, 255, 0.05);
      border: 1px solid rgba(0, 229, 255, 0.22);
      border-left: 3px solid var(--plasma);
      border-bottom-left-radius: 3px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    .msg-u {
      align-self: flex-end;
      background: rgba(255, 183, 0, 0.04);
      border: 1px solid rgba(255, 183, 0, 0.2);
      border-right: 3px solid var(--gold);
      border-bottom-right-radius: 3px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }
    .msg-sys {
      align-self: center;
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--muted);
      padding: 3px 12px;
      background: rgba(0, 229, 255, 0.03);
      border: 1px solid rgba(0, 229, 255, 0.1);
      border-radius: 99px;
      letter-spacing: 0.5px;
    }

    .lbl {
      font-family: 'Orbitron', monospace;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 5px;
    }
    .msg-j .lbl {
      color: var(--plasma);
      text-shadow: 0 0 8px rgba(0, 229, 255, 0.5);
    }
    .msg-u .lbl {
      color: var(--gold);
      text-align: right;
      text-shadow: 0 0 8px rgba(255, 183, 0, 0.4);
    }

    /* ── FILE CARD ── */
    .msg-file {
      align-self: flex-end;
      background: var(--surface);
      border: 1px solid var(--border);
      border-right: 3px solid var(--plasma);
      border-radius: 12px;
      border-bottom-right-radius: 3px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 14px;
      max-width: 82%;
      animation: pop 0.2s ease;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }
    .fc-icon { font-size: 26px; flex-shrink: 0; filter: drop-shadow(0 0 8px rgba(0,229,255,0.4)); }
    .fc-meta { flex: 1; min-width: 0; }
    .fc-lbl  {
      font-family: 'Orbitron', monospace;
      font-size: 8px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--plasma);
      margin-bottom: 4px;
    }
    .fc-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #fff;
    }
    .fc-size {
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }
    .fc-bar-wrap {
      height: 4px;
      background: rgba(0, 10, 24, 0.8);
      border: 1px solid var(--border);
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }
    .fc-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #0099cc, #00e5ff);
      box-shadow: 0 0 8px var(--plasma);
      border-radius: 2px;
      transition: width 0.12s linear;
    }
    .fc-status {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1px;
      flex-shrink: 0;
      color: var(--muted);
    }
    .fc-status.done { color: var(--green); text-shadow: 0 0 6px var(--green); }
    .fc-status.err  { color: var(--red); text-shadow: 0 0 6px var(--red); }
    .fc-dl {
      display: inline-block;
      margin-top: 6px;
      font-size: 11px;
      color: var(--plasma);
      text-decoration: none;
      font-weight: 700;
      letter-spacing: 1px;
      transition: all 0.2s;
    }
    .fc-dl:hover {
      color: #fff;
      text-shadow: 0 0 8px var(--plasma);
    }

    /* ── FOOTER ── */
    footer {
      position: relative;
      z-index: 2;
      flex-shrink: 0;
      padding: 12px 18px;
      border-top: 1px solid var(--border);
      background: rgba(1, 8, 18, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      gap: 10px;
      align-items: center;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.4);
    }
    #inp {
      flex: 1;
      padding: 12px 16px;
      background: rgba(0, 10, 24, 0.75);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: #ffffff;
      font-size: 14px;
      font-family: 'Rajdhani', sans-serif;
      font-weight: 600;
      outline: none;
      transition: all 0.2s ease;
    }
    #inp:focus {
      border-color: var(--plasma);
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.25), inset 0 0 8px rgba(0, 229, 255, 0.1);
      background: rgba(0, 18, 38, 0.85);
    }
    #inp::placeholder { color: rgba(74, 154, 184, 0.5); }

    .btn {
      padding: 11px 16px;
      border: none;
      border-radius: 12px;
      font-family: 'Orbitron', monospace;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 2px;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:active { transform: scale(0.96); }
    .btn:hover  { filter: brightness(1.15); }

    .btn-send {
      background: linear-gradient(135deg, #0099cc 0%, #00e5ff 100%);
      color: #000814;
      box-shadow: 0 0 14px rgba(0, 229, 255, 0.35);
    }
    .btn-wake {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      display: none;
    }
    .btn-wake.show {
      display: block;
      color: var(--green);
      border-color: rgba(0, 255, 153, 0.4);
      box-shadow: 0 0 10px rgba(0, 255, 153, 0.2);
    }
    .btn-attach {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 14px;
      font-size: 16px;
      line-height: 1;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .btn-attach:hover {
      border-color: var(--plasma);
      color: var(--plasma);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.25);
    }
    .btn-attach:active { transform: scale(0.96); }

    /* ── MIC BUTTON ── */
    #mic-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--muted);
      padding: 10px 14px;
      font-size: 16px;
      line-height: 1;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    #mic-btn:hover {
      border-color: var(--plasma);
      color: var(--plasma);
      box-shadow: 0 0 10px rgba(0, 229, 255, 0.25);
    }
    #mic-btn:active { transform: scale(0.96); }
    #mic-btn.recording {
      background: rgba(255, 17, 68, 0.18);
      border-color: rgba(255, 17, 68, 0.6);
      color: var(--red);
      box-shadow: 0 0 20px rgba(255, 17, 68, 0.4);
      animation: mic-pulse 1s ease-in-out infinite;
    }
    #mic-btn.unsupported { opacity: 0.3; cursor: not-allowed; }
    @keyframes mic-pulse {
      0%,100%{opacity:1; transform:scale(1)}
      50%{opacity:0.65; transform:scale(0.96)}
    }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      top: 68px;
      left: 50%;
      transform: translateX(-50%) translateY(-8px);
      background: rgba(0, 14, 28, 0.92);
      border: 1px solid var(--plasma);
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.3);
      color: var(--plasma);
      font-family: 'Orbitron', monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      padding: 8px 22px;
      border-radius: 99px;
      opacity: 0;
      transition: all 0.25s ease;
      pointer-events: none;
      white-space: nowrap;
      z-index: 100;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="scanlines"></div>
  <div id="toast"></div>

  <header>
    <div class="logo"><em>J</em>ARVIS</div>
    <div class="pill" id="pill"><span class="dot"></span><span id="st">Connecting</span></div>
    <div class="enc-badge" id="enc">AES-256</div>
    <div class="spacer"></div>
    <div class="url">__IP__:__PORT__</div>
  </header>

  <main id="feed"></main>

  <footer>
    <input id="inp" placeholder="Transmit command or inquiry to JARVIS…" autocomplete="off">
    <label class="btn-attach" for="file-inp" title="Send file">📎</label>
    <input type="file" id="file-inp" multiple accept="*/*" style="display:none">
    <button id="mic-btn" onclick="doMic()" title="Voice command">🎤</button>
    <button class="btn btn-wake" id="wake" onclick="doWake()">WAKE</button>
    <button class="btn btn-send" onclick="doSend()">EXECUTE</button>
  </footer>

  <script>
    // ── Animated Background (Hex Grid + Floating Dust) ──────────────────────
    const bgCvs = document.getElementById('bg-canvas');
    const bgCtx = bgCvs.getContext('2d');
    let bW, bH;

    function resizeBg() {
      bW = bgCvs.width = window.innerWidth;
      bH = bgCvs.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeBg);
    resizeBg();

    const dust = Array.from({ length: 60 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      r: Math.random() * 1.5 + 0.5,
      vy: -(Math.random() * 0.3 + 0.1),
      alpha: Math.random() * 0.4 + 0.1
    }));

    function drawBg() {
      bgCtx.clearRect(0, 0, bW, bH);

      // Subtle Hex Grid pattern
      const hSize = 36;
      const hW = Math.sqrt(3) * hSize;
      const hH = 2 * hSize;
      bgCtx.strokeStyle = 'rgba(0, 229, 255, 0.03)';
      bgCtx.lineWidth = 1;

      for (let y = -hH; y < bH + hH; y += hH * 0.75) {
        const offset = (Math.floor(y / (hH * 0.75)) % 2) * (hW / 2);
        for (let x = -hW; x < bW + hW; x += hW) {
          const cx = x + offset;
          const cy = y;
          bgCtx.beginPath();
          for (let i = 0; i < 6; i++) {
            const ang = (Math.PI / 3) * i + Math.PI / 6;
            const px = cx + hSize * Math.cos(ang);
            const py = cy + hSize * Math.sin(ang);
            if (i === 0) bgCtx.moveTo(px, py);
            else bgCtx.lineTo(px, py);
          }
          bgCtx.closePath();
          bgCtx.stroke();
        }
      }

      // Drifting ambient dust
      bgCtx.fillStyle = 'rgba(0, 229, 255, 0.4)';
      for (const d of dust) {
        d.y += d.vy;
        if (d.y < -5) { d.y = bH + 5; d.x = Math.random() * bW; }
        bgCtx.globalAlpha = d.alpha;
        bgCtx.beginPath();
        bgCtx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
        bgCtx.fill();
      }
      bgCtx.globalAlpha = 1.0;

      requestAnimationFrame(drawBg);
    }
    requestAnimationFrame(drawBg);

    // ── Auth — bearer token ───────────────────────────────────────────────────
    const _authToken  = sessionStorage.getItem('jarvis_token');
    const _sessionKey = sessionStorage.getItem('jarvis_key');

    if (!_authToken) {
      location.replace('/login');
    }

    function _authHeader() { return { 'Authorization': `Bearer ${_authToken}` }; }
    function _authFetch(url, opts = {}) {
      opts.headers = Object.assign({}, opts.headers, _authHeader());
      return fetch(url, opts);
    }

    // ── AES-256-CBC encryption (CryptoJS) ────────────────────────────────────
    const _AES_SALT = 'JARVIS-DASHBOARD-v1';
    let _aesKey = null;

    function _initCrypto(key) {
      if (typeof CryptoJS === 'undefined') return false;
      _aesKey = CryptoJS.SHA256(key + _AES_SALT);
      return true;
    }

    function _encrypt(plaintext) {
      if (!_aesKey || typeof CryptoJS === 'undefined') return null;
      try {
        const iv  = CryptoJS.lib.WordArray.random(16);
        const enc = CryptoJS.AES.encrypt(
          CryptoJS.enc.Utf8.parse(plaintext), _aesKey,
          { iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 }
        );
        const ivHex = iv.toString(CryptoJS.enc.Hex);
        const ctHex = enc.ciphertext.toString(CryptoJS.enc.Hex);
        const hex   = ivHex + ctHex;
        const bytes = new Uint8Array(hex.length / 2);
        for (let i = 0; i < bytes.length; i++)
          bytes[i] = parseInt(hex.substr(i * 2, 2), 16);
        return btoa(String.fromCharCode(...bytes));
      } catch { return null; }
    }

    const _encReady = _sessionKey ? _initCrypto(_sessionKey) : false;
    const encBadge  = document.getElementById('enc');
    if (_encReady) { encBadge.className = 'enc-badge on'; }
    else           { encBadge.className = 'enc-badge off'; encBadge.textContent = 'NO ENC'; }

    // ── WebSocket ─────────────────────────────────────────────────────────────
    const feed  = document.getElementById('feed');
    const pill  = document.getElementById('pill');
    const stTxt = document.getElementById('st');
    const wake  = document.getElementById('wake');

    const _wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
    const _wsUrl   = `${_wsProto}://${location.host}/ws?token=${encodeURIComponent(_authToken)}`;
    const ws       = new WebSocket(_wsUrl);

    ws.onopen    = () => { sys('QUANTUM LINK ESTABLISHED // REMOTE SESSION ACTIVE'); toast('SYSTEM LINKED'); };
    ws.onclose   = () => sys('QUANTUM LINK SEVERED — REFRESH TO RECONNECT');
    ws.onerror   = () => sys('COMMUNICATION BUS ERROR');
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'log')           append(m.speaker, m.text);
      if (m.type === 'status')        setStatus(m.state);
      if (m.type === 'wake')          sys('WAKE EVENT DETECTED — CONNECTING AUDIO STREAM…');
      if (m.type === 'sys')           sys(m.text);
      if (m.type === 'file_received') _onFileReceived(m);
    };

    function setStatus(s) {
      if (s === 'active') {
        pill.className = 'pill on'; stTxt.textContent = 'Active'; wake.classList.remove('show');
      } else {
        pill.className = 'pill'; stTxt.textContent = 'Standby'; wake.classList.add('show');
      }
    }

    function append(speaker, text) {
      const d = document.createElement('div');
      if (speaker === 'jarvis') {
        d.className = 'msg msg-j';
        d.innerHTML = `<div class="lbl">JARVIS // CORE</div>${esc(text)}`;
      } else {
        d.className = 'msg msg-u';
        d.innerHTML = `<div class="lbl">OPERATOR</div>${esc(text)}`;
      }
      feed.appendChild(d);
      feed.scrollTop = feed.scrollHeight;
    }

    function sys(text) {
      const d = document.createElement('div');
      d.className = 'msg msg-sys'; d.textContent = text;
      feed.appendChild(d); feed.scrollTop = feed.scrollHeight;
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── File helpers ──────────────────────────────────────────────────────────
    function _fileIcon(name) {
      const ext = (name.split('.').pop() || '').toLowerCase();
      if (['jpg','jpeg','png','gif','webp','heic','heif','avif','bmp','svg'].includes(ext)) return '🖼️';
      if (['mp4','mov','avi','mkv','webm','m4v','3gp'].includes(ext))                       return '🎬';
      if (['mp3','m4a','wav','flac','aac','ogg','opus'].includes(ext))                      return '🎵';
      if (['pdf'].includes(ext))                                                             return '📋';
      if (['doc','docx','txt','md','rtf','odt'].includes(ext))                              return '📝';
      if (['xls','xlsx','csv','ods'].includes(ext))                                         return '📊';
      if (['ppt','pptx','odp'].includes(ext))                                               return '📑';
      if (['zip','rar','7z','tar','gz','bz2','xz'].includes(ext))                          return '📦';
      if (['apk','exe','dmg','deb','rpm','msi'].includes(ext))                              return '⚙️';
      return '📎';
    }

    function _fmtSize(bytes) {
      if (bytes < 1024)             return bytes + ' B';
      if (bytes < 1024 * 1024)     return (bytes / 1024).toFixed(1) + ' KB';
      if (bytes < 1024 ** 3)       return (bytes / 1024 / 1024).toFixed(1) + ' MB';
      return (bytes / 1024 ** 3).toFixed(2) + ' GB';
    }

    // ── File upload (phone → computer) ────────────────────────────────────────
    function _uploadFile(file) {
      const id = 'fc_' + Date.now() + '_' + Math.random().toString(36).slice(2);

      const card = document.createElement('div');
      card.className = 'msg-file';
      card.id = id;
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(file.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">TRANSMITTING</div>
          <div class="fc-name">${esc(file.name)}</div>
          <div class="fc-size">${_fmtSize(file.size)}</div>
          <div class="fc-bar-wrap"><div class="fc-bar" id="${id}_bar"></div></div>
        </div>
        <div class="fc-status" id="${id}_st">0%</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;

      const xhr = new XMLHttpRequest();
      xhr.open('POST', '/api/upload');
      xhr.setRequestHeader('Authorization', `Bearer ${_authToken}`);

      xhr.upload.onprogress = (e) => {
        if (!e.lengthComputable) return;
        const pct = Math.round(e.loaded / e.total * 100);
        const bar = document.getElementById(`${id}_bar`);
        const st  = document.getElementById(`${id}_st`);
        if (bar) bar.style.width = pct + '%';
        if (st)  st.textContent  = pct + '%';
      };

      xhr.onload = () => {
        const bar  = document.getElementById(`${id}_bar`);
        const st   = document.getElementById(`${id}_st`);
        const meta = card.querySelector('.fc-meta');
        const lbl  = card.querySelector('.fc-lbl');
        if (xhr.status === 200) {
          let savedName = file.name;
          try { savedName = JSON.parse(xhr.responseText).name || file.name; } catch {}
          const dlUrl = `/uploads/${encodeURIComponent(savedName)}?token=${encodeURIComponent(_authToken)}`;
          if (bar)  { bar.style.width = '100%'; bar.style.background = 'var(--green)'; }
          if (st)   { st.textContent = '✓'; st.className = 'fc-status done'; }
          if (lbl)  lbl.textContent = 'STORED';
          if (meta) meta.insertAdjacentHTML('beforeend',
            `<a class="fc-dl" href="${dlUrl}" download="${esc(savedName)}">⬇ RETRIEVE PAYLOAD</a>`);
          toast('FILE UPLOADED');
        } else {
          let errMsg = 'Upload failed';
          try { errMsg = JSON.parse(xhr.responseText).error || errMsg; } catch {}
          if (bar) bar.style.background = 'var(--red)';
          if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
          if (lbl) lbl.textContent = errMsg;
        }
      };

      xhr.onerror = () => {
        const st  = document.getElementById(`${id}_st`);
        const lbl = card.querySelector('.fc-lbl');
        if (st)  { st.textContent = 'ERR'; st.className = 'fc-status err'; }
        if (lbl) lbl.textContent = 'Connection error';
      };

      const fd = new FormData();
      fd.append('file', file);
      xhr.send(fd);
    }

    function _onFileReceived(m) {
      const dlUrl = `/uploads/${encodeURIComponent(m.name)}?token=${encodeURIComponent(_authToken)}`;
      const card  = document.createElement('div');
      card.className = 'msg-file';
      card.innerHTML = `
        <div class="fc-icon">${_fileIcon(m.name)}</div>
        <div class="fc-meta">
          <div class="fc-lbl">INCOMING DATA</div>
          <div class="fc-name">${esc(m.name)}</div>
          <div class="fc-size">${_fmtSize(m.size)}</div>
          <a class="fc-dl" href="${dlUrl}" download="${esc(m.name)}">⬇ DOWNLOAD</a>
        </div>
        <div class="fc-status done">✓</div>
      `;
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      toast('PAYLOAD RECEIVED');
    }

    document.getElementById('file-inp').addEventListener('change', function () {
      Array.from(this.files).forEach(_uploadFile);
      this.value = '';
    });

    // ── Commands ──────────────────────────────────────────────────────────────
    function doSend() {
      const inp = document.getElementById('inp');
      const txt = inp.value.trim();
      if (!txt) return;
      inp.value = '';
      append('user', txt);
      const enc  = _encrypt(txt);
      const body = enc ? { enc } : { text: txt };
      _authFetch('/api/command', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
    }

    function doWake() {
      sys('TRANSMITTING WAKE FREQUENCY…');
      _authFetch('/api/wake', { method: 'POST' });
    }

    document.getElementById('inp').addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); doSend(); }
    });

    // ── Toast ─────────────────────────────────────────────────────────────────
    let _toastTimer;
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(_toastTimer);
      _toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
    }

    // ── Real-time Voice — PCM16 WebSocket → Gemini Live ──────────────────────
    const micBtn  = document.getElementById('mic-btn');
    let _voiceWs  = null;
    let _audioCtx = null;
    let _micStm   = null;
    let _audioNd  = null;

    function _micIdle() {
      micBtn.innerHTML = '🎤';
      micBtn.title     = 'Voice — tap to speak';
      micBtn.classList.remove('recording');
    }

    function _f32toPcm16(f32, srcRate) {
      let s = f32;
      if (srcRate !== 16000) {
        const ratio = srcRate / 16000;
        const len   = Math.round(f32.length / ratio);
        s = new Float32Array(len);
        for (let i = 0; i < len; i++)
          s[i] = f32[Math.min(Math.round(i * ratio), f32.length - 1)];
      }
      const out = new Int16Array(s.length);
      for (let i = 0; i < s.length; i++)
        out[i] = Math.max(-32768, Math.min(32767, Math.round(s[i] * 32768)));
      return out.buffer;
    }

    function _showVoiceSetup() {
      if (document.getElementById('voice-setup')) return;
      const origin = location.origin;
      const card = document.createElement('div');
      card.id = 'voice-setup';
      card.style.cssText = [
        'align-self:stretch', 'background:rgba(0, 229, 255, 0.06)',
        'border:1px solid rgba(0, 229, 255, 0.28)', 'border-left:3px solid var(--plasma)',
        'border-radius:12px', 'padding:16px 18px', 'font-size:13px', 'line-height:1.8',
        'animation:pop 0.2s ease', 'backdrop-filter:blur(12px)'
      ].join(';');
      card.innerHTML =
        '<div style="font-family:Orbitron,monospace;font-weight:700;color:var(--plasma);letter-spacing:1px;margin-bottom:10px">🎤 ONE-TIME VOICE PROTOCOL SETUP</div>' +
        '<ol style="padding-left:18px;color:#88aacc;margin:0;display:flex;flex-direction:column;gap:4px">' +
        '<li>Open a new tab → navigate to <span style="background:rgba(0,229,255,0.1);border:1px solid rgba(0,229,255,0.2);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:12px;color:#fff">chrome://flags</span></li>' +
        '<li>Search for: <strong style="color:#fff">Insecure origins treated as secure</strong></li>' +
        '<li>Paste this URL into the input field:<br><span id="flags-url" style="background:rgba(0,229,255,0.12);border:1px solid var(--plasma);padding:2px 8px;border-radius:4px;font-family:monospace;font-size:11px;user-select:all;cursor:pointer;color:var(--plasma)">' + esc(origin) + '</span></li>' +
        '<li>Set to <strong style="color:var(--green)">Enabled</strong> → tap <strong style="color:#fff">Relaunch</strong></li>' +
        '<li>Return here and tap 🎤 to begin transmission</li>' +
        '</ol>';
      feed.appendChild(card);
      feed.scrollTop = feed.scrollHeight;
      card.querySelector('#flags-url').addEventListener('click', () => {
        navigator.clipboard?.writeText(origin).then(() => toast('URL COPIED')).catch(() => {});
      });
    }

    async function doMic() {
      if (_voiceWs) { _stopVoice(); return; }

      if (!navigator.mediaDevices?.getUserMedia) {
        _showVoiceSetup();
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          audio: { channelCount: 1, echoCancellation: true, noiseSuppression: true },
        });
      } catch (e) {
        sys(e.name === 'NotAllowedError'
          ? 'Microphone permission denied — please permit audio access in browser settings.'
          : 'Audio capture failure: ' + e.message);
        return;
      }

      let ctx;
      try { ctx = new AudioContext({ sampleRate: 16000 }); }
      catch (_) { ctx = new AudioContext(); }
      if (ctx.state === 'suspended') await ctx.resume();

      const wsProto = location.protocol === 'https:' ? 'wss' : 'ws';
      const ws = new WebSocket(
        `${wsProto}://${location.host}/ws/phone-audio?token=${encodeURIComponent(_authToken)}`
      );
      ws.binaryType = 'arraybuffer';

      ws.onopen = async () => {
        const rate = ctx.sampleRate;
        const src  = ctx.createMediaStreamSource(stream);

        const wCode = `class J extends AudioWorkletProcessor{process(i){const c=i[0]?.[0];if(c)this.port.postMessage(c.slice());return true;}}registerProcessor('j',J);`;
        try {
          const burl = URL.createObjectURL(new Blob([wCode], { type: 'application/javascript' }));
          await ctx.audioWorklet.addModule(burl);
          URL.revokeObjectURL(burl);
          const nd = new AudioWorkletNode(ctx, 'j');
          let _pbuf = [], _plen = 0;
          nd.port.onmessage = e => {
            const chunk = new Int16Array(_f32toPcm16(e.data, rate));
            _pbuf.push(chunk); _plen += chunk.length;
            if (_plen >= 1024) {
              const out = new Int16Array(_plen); let off = 0;
              for (const c of _pbuf) { out.set(c, off); off += c.length; }
              if (ws.readyState === 1) ws.send(out.buffer);
              _pbuf = []; _plen = 0;
            }
          };
          src.connect(nd);
          _audioNd = nd;
        } catch (_) {
          const sp = ctx.createScriptProcessor(4096, 1, 1);
          sp.onaudioprocess = e => {
            if (ws.readyState === 1) ws.send(_f32toPcm16(e.inputBuffer.getChannelData(0), rate));
          };
          src.connect(sp); sp.connect(ctx.destination);
          _audioNd = sp;
        }

        micBtn.innerHTML = '⏹';
        micBtn.title     = 'Tap to terminate voice channel';
        micBtn.classList.add('recording');
        sys('LIVE VOICE UPLINK ACTIVE — TRANSMITTING AUDIO');
        toast('VOICE ACTIVE');
      };

      ws.onclose = () => { _stopVoice(); };
      ws.onerror = () => { sys('VOICE UPLINK FAILURE'); _stopVoice(); };

      _voiceWs  = ws;
      _audioCtx = ctx;
      _micStm   = stream;
    }

    function _stopVoice() {
      if (_audioNd)  { try { _audioNd.disconnect(); }  catch (_) {}; _audioNd  = null; }
      if (_audioCtx) { try { _audioCtx.close(); }      catch (_) {}; _audioCtx = null; }
      if (_micStm)   { _micStm.getTracks().forEach(t => t.stop()); _micStm = null; }
      if (_voiceWs)  {
        const w = _voiceWs; _voiceWs = null;
        if (w.readyState < 2) w.close();
      }
      _micIdle();
    }
  </script>
</body>
</html>
