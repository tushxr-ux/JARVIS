<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>JARVIS // QUANTUM ACCESS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --void:    #000408;
      --deep:    #010812;
      --card:    rgba(1, 14, 26, 0.78);
      --border:  rgba(0, 229, 255, 0.22);
      --border-b: rgba(0, 229, 255, 0.55);
      --plasma:  #00e5ff;
      --plasma-dim: #0088aa;
      --plasma-gho: rgba(0, 229, 255, 0.08);
      --gold:    #ffb700;
      --gold-hot: #fff5a0;
      --text:    #c8eeff;
      --muted:   #4a9ab8;
      --red:     #ff1144;
      --green:   #00ff99;
    }
    html, body {
      height: 100%;
      background: var(--void);
      color: var(--text);
      font-family: 'Rajdhani', -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }

    /* ── Canvas Background ── */
    #bg-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
      pointer-events: none;
    }

    /* ── Vignette & Scanline Overlay ── */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(0, 4, 8, 0.85) 100%);
      pointer-events: none;
      z-index: 1;
    }
    .scanlines {
      position: absolute;
      inset: 0;
      background: linear-gradient(rgba(0, 229, 255, 0) 50%, rgba(0, 229, 255, 0.02) 50%);
      background-size: 100% 4px;
      pointer-events: none;
      z-index: 1;
    }

    /* ── Futuristic Card ── */
    .card-wrap {
      position: relative;
      z-index: 2;
      padding: 3px;
    }
    .card {
      position: relative;
      width: 360px;
      padding: 44px 34px;
      background: var(--card);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--border);
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 0 50px rgba(0, 229, 255, 0.09), inset 0 0 30px rgba(0, 229, 255, 0.03);
    }

    /* Cyberpunk Corner Brackets */
    .corner {
      position: absolute;
      width: 14px; height: 14px;
      border: 2px solid var(--plasma);
      pointer-events: none;
    }
    .c-tl { top: -1px; left: -1px; border-right: none; border-bottom: none; border-top-left-radius: 6px; }
    .c-tr { top: -1px; right: -1px; border-left: none; border-bottom: none; border-top-right-radius: 6px; }
    .c-bl { bottom: -1px; left: -1px; border-right: none; border-top: none; border-bottom-left-radius: 6px; }
    .c-br { bottom: -1px; right: -1px; border-left: none; border-top: none; border-bottom-right-radius: 6px; }

    /* Telemetry Header */
    .top-telemetry {
      display: flex;
      justify-content: space-between;
      font-family: 'Share Tech Mono', monospace;
      font-size: 9px;
      color: var(--muted);
      letter-spacing: 2px;
      margin-bottom: 20px;
      border-bottom: 1px solid rgba(0, 229, 255, 0.12);
      padding-bottom: 8px;
    }
    .top-telemetry span.active {
      color: var(--green);
    }

    .logo {
      font-family: 'Orbitron', monospace;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: 12px;
      color: #fff;
      text-shadow: 0 0 20px rgba(0, 229, 255, 0.7), 0 0 40px rgba(0, 229, 255, 0.3);
      margin-bottom: 4px;
    }
    .logo em {
      color: var(--plasma);
      font-style: normal;
    }
    .sub {
      font-family: 'Orbitron', monospace;
      font-size: 9px;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 12px;
      text-shadow: 0 0 10px rgba(255, 183, 0, 0.4);
    }
    .hint {
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
      margin-bottom: 26px;
      font-weight: 500;
    }
    .hint strong {
      color: var(--text);
    }

    .key-wrap {
      position: relative;
      margin-bottom: 16px;
    }
    .key-input {
      width: 100%;
      padding: 16px 12px;
      background: rgba(0, 10, 24, 0.75);
      border: 1.5px solid var(--border);
      border-radius: 12px;
      color: #ffffff;
      font-size: 30px;
      font-weight: 700;
      font-family: 'Share Tech Mono', 'Courier New', monospace;
      text-align: center;
      letter-spacing: 12px;
      text-transform: uppercase;
      outline: none;
      transition: all 0.25s ease;
      caret-color: var(--plasma);
      box-shadow: inset 0 0 15px rgba(0, 0, 0, 0.6);
    }
    .key-input::placeholder {
      color: rgba(74, 154, 184, 0.35);
      letter-spacing: 8px;
      font-size: 22px;
    }
    .key-input:focus {
      border-color: var(--plasma);
      background: rgba(0, 229, 255, 0.05);
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.28), inset 0 0 10px rgba(0, 229, 255, 0.15);
    }

    .err {
      font-family: 'Share Tech Mono', monospace;
      font-size: 11px;
      color: var(--red);
      min-height: 18px;
      margin-bottom: 14px;
      letter-spacing: 1px;
      text-shadow: 0 0 8px rgba(255, 17, 68, 0.5);
    }

    .btn {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #0099cc 0%, #00e5ff 100%);
      color: #000814;
      font-family: 'Orbitron', monospace;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 4px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
    }
    .btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 0 35px rgba(0, 229, 255, 0.65);
      filter: brightness(1.1);
    }
    .btn:active {
      transform: translateY(1px);
      box-shadow: 0 0 12px rgba(0, 229, 255, 0.3);
    }

    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%,60% { transform: translateX(-8px); }
      40%,80% { transform: translateX(8px); }
    }
    .shake { animation: shake 0.35s ease; }

    .voice-note {
      font-size: 11px;
      color: var(--muted);
      margin-top: 22px;
      line-height: 1.6;
      text-align: left;
      border-top: 1px solid rgba(0, 229, 255, 0.1);
      padding-top: 14px;
    }
    .voice-note code {
      background: rgba(0, 229, 255, 0.08);
      border: 1px solid rgba(0, 229, 255, 0.15);
      padding: 1px 5px;
      border-radius: 3px;
      font-family: 'Share Tech Mono', monospace;
      font-size: 10px;
      color: var(--plasma);
    }
    #reconnecting {
      display: none;
      font-family: 'Share Tech Mono', monospace;
      color: var(--gold);
      font-size: 12px;
      margin-bottom: 16px;
      letter-spacing: 2px;
      animation: blink 1.5s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0.3} }
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <div class="card-wrap">
    <div class="card" id="card">
      <div class="corner c-tl"></div>
      <div class="corner c-tr"></div>
      <div class="corner c-bl"></div>
      <div class="corner c-br"></div>

      <div class="top-telemetry">
        <span>MARK LIII // SYS</span>
        <span class="active">● CORE ONLINE</span>
      </div>

      <div class="logo"><em>J</em>ARVIS</div>
      <div class="sub">QUANTUM CORE // ACCESS</div>
      <p id="reconnecting">AUTHENTICATING SESSION…</p>
      <p class="hint">Press <strong style="color:var(--plasma)">Remote Control</strong> in the JARVIS desktop app to obtain your 6-digit access code.</p>

      <div class="key-wrap">
        <input class="key-input" id="key" type="text" maxlength="6"
               autocomplete="off" autocorrect="off" spellcheck="false"
               placeholder="· · · · · ·">
      </div>
      <div class="err" id="err"></div>
      <button class="btn" onclick="doLogin()">AUTHORIZE</button>
      <p class="voice-note">
        🎤 <strong style="color:var(--text)">Voice Uplink:</strong> open
        <code>chrome://flags</code> on mobile, search
        <code>Insecure origins treated as secure</code>, add your URL, and relaunch.
      </p>
    </div>
  </div>

  <script>
    // ── 3D Quantum Rings & Starfield Animation ────────────────────────────────
    const cvs = document.getElementById('bg-canvas');
    const ctx = cvs.getContext('2d');
    let W, H, cx, cy;

    function resize() {
      W = cvs.width = window.innerWidth;
      H = cvs.height = window.innerHeight;
      cx = W / 2; cy = H / 2;
    }
    window.addEventListener('resize', resize);
    resize();

    // Ambient stars
    const stars = Array.from({ length: 90 }, () => ({
      x: Math.random() * 2 - 1,
      y: Math.random() * 2 - 1,
      z: Math.random() * 1.5 + 0.2,
      sz: Math.random() * 1.5 + 0.5,
      tw: Math.random() * 6.28,
    }));

    // Sphere particle nodes (inspired by the golden particle sphere reference)
    const sphereNodes = [];
    const THETA_STEPS = 14;
    const PHI_STEPS = 28;
    for (let t = 0; t <= THETA_STEPS; t++) {
      const theta = (t / THETA_STEPS) * Math.PI;
      const sinT = Math.sin(theta);
      const cosT = Math.cos(theta);
      for (let p = 0; p < PHI_STEPS; p++) {
        const phi = (p / PHI_STEPS) * 2 * Math.PI;
        sphereNodes.push({
          x: sinT * Math.cos(phi),
          y: sinT * Math.sin(phi),
          z: cosT,
          theta, phi
        });
      }
    }

    let frame = 0;
    function render() {
      ctx.clearRect(0, 0, W, H);
      frame++;

      // Subtle radial glow behind center
      const radGlow = ctx.createRadialGradient(cx, cy, 20, cx, cy, Math.min(W, H) * 0.6);
      radGlow.addColorStop(0, 'rgba(0, 229, 255, 0.07)');
      radGlow.addColorStop(0.5, 'rgba(0, 100, 200, 0.02)');
      radGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = radGlow;
      ctx.fillRect(0, 0, W, H);

      // Stars
      for (const s of stars) {
        s.tw += 0.03;
        const alpha = 0.2 + 0.3 * Math.sin(s.tw);
        const sx = cx + s.x * (W * 0.48);
        const sy = cy + s.y * (H * 0.48);
        ctx.fillStyle = `rgba(200, 240, 255, ${alpha})`;
        ctx.beginPath();
        ctx.arc(sx, sy, s.sz, 0, Math.PI * 2);
        ctx.fill();
      }

      // 3D Orbital Ellipses
      const rBase = Math.min(W, H) * 0.38;
      const rings = [
        { rot: frame * 0.008, tilt: 0.35, col: 'rgba(0, 229, 255, 0.28)', gold: 'rgba(255, 183, 0, 0.3)' },
        { rot: -frame * 0.005 + 1.2, tilt: 0.65, col: 'rgba(0, 229, 255, 0.18)', gold: 'rgba(255, 183, 0, 0.2)' },
        { rot: frame * 0.012 + 2.5, tilt: 0.25, col: 'rgba(0, 180, 255, 0.22)', gold: 'rgba(255, 183, 0, 0.25)' },
      ];

      for (const ring of rings) {
        ctx.save();
        ctx.translate(cx, cy);
        ctx.rotate(ring.rot);
        ctx.scale(1, ring.tilt);

        ctx.strokeStyle = ring.col;
        ctx.lineWidth = 1.2;
        ctx.setLineDash([8, 14]);
        ctx.beginPath();
        ctx.arc(0, 0, rBase, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = ring.gold;
        ctx.lineWidth = 2.0;
        ctx.setLineDash([30, 90]);
        ctx.beginPath();
        ctx.arc(0, 0, rBase, frame * 0.02, frame * 0.02 + Math.PI * 0.8);
        ctx.stroke();
        ctx.restore();
      }

      // 3D Rotating Particle Sphere
      const sphereR = Math.min(W, H) * 0.22;
      const rotY = frame * 0.009;
      const rotX = Math.sin(frame * 0.004) * 0.25;
      const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
      const cosX = Math.cos(rotX), sinX = Math.sin(rotX);

      for (const n of sphereNodes) {
        // Rotate around Y
        const x1 = n.x * cosY + n.z * sinY;
        const z1 = -n.x * sinY + n.z * cosY;
        // Rotate around X
        const y2 = n.y * cosX - z1 * sinX;
        const z2 = n.y * sinX + z1 * cosX;

        const fov = 400;
        const depth = fov / (fov + z2 * sphereR + 100);
        const px = cx + x1 * sphereR * depth;
        const py = cy - y2 * sphereR * depth * 0.9;
        const normZ = (z2 + 1) / 2;

        if (normZ > 0.08) {
          const alpha = Math.max(0.08, normZ * 0.65);
          const isGold = normZ > 0.65;
          ctx.fillStyle = isGold
            ? `rgba(255, 183, 0, ${alpha})`
            : `rgba(0, 229, 255, ${alpha * 0.7})`;
          ctx.beginPath();
          ctx.arc(px, py, Math.max(0.6, normZ * 1.8), 0, Math.PI * 2);
          ctx.fill();
        }
      }

      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);

    // ── Preserved Auth Logic ──────────────────────────────────────────────────
    (async function() {
      const devTok = localStorage.getItem('jarvis_device_token');
      if (!devTok) return;
      document.getElementById('reconnecting').style.display = 'block';
      try {
        const r = await fetch('/api/device-login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_token: devTok }),
        });
        const d = await r.json();
        if (d.ok && d.token) {
          sessionStorage.setItem('jarvis_key', d.key);
          sessionStorage.setItem('jarvis_token', d.token);
          location.replace('/');
          return;
        }
      } catch (_) {}
      localStorage.removeItem('jarvis_device_token');
      document.getElementById('reconnecting').style.display = 'none';
    })();

    const inp = document.getElementById('key');
    inp.focus();

    inp.addEventListener('input', () => {
      inp.value = inp.value.toUpperCase().replace(/[^A-Z2-9]/g, '');
      if (inp.value.length === 6) doLogin();
    });
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    async function doLogin() {
      const key = inp.value.trim();
      if (key.length < 6) { shake(); return; }
      let data;
      try {
        const r = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ pin: key })
        });
        data = await r.json();
      } catch (e) {
        document.getElementById('err').textContent = 'CONNECTION FAILURE';
        shake(); return;
      }
      if (data.ok && data.token) {
        sessionStorage.setItem('jarvis_key', key);
        sessionStorage.setItem('jarvis_token', data.token);
        location.href = '/';
      } else {
        inp.value = '';
        inp.focus();
        document.getElementById('err').textContent = 'INVALID OR EXPIRED AUTHORIZATION';
        shake();
      }
    }

    function shake() {
      const c = document.getElementById('card');
      c.classList.remove('shake');
      void c.offsetWidth;
      c.classList.add('shake');
    }
  </script>
</body>
</html>
